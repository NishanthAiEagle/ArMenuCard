<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Japanese Cuisine — AR Menu</title>

<style>
body {
  margin:0;
  background:#000;
  font-family:sans-serif;
}
#start-btn {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:16px 30px;
  font-size:16px;
  background:#8b1a1a;
  color:#fff;
  border:none;
}
#status {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
}
</style>
</head>

<body>

<button id="start-btn">Start AR</button>
<div id="status">Waiting...</div>

<div id="ar-wrap" style="display:none;"></div>

<script>
const statusEl = document.getElementById("status");
const btn = document.getElementById("start-btn");

btn.onclick = async () => {

  btn.disabled = true;
  statusEl.innerText = "Requesting camera...";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:true });
    stream.getTracks().forEach(t => t.stop());
  } catch(e){
    statusEl.innerText = "❌ Camera permission denied";
    btn.disabled = false;
    return;
  }

  statusEl.innerText = "Loading AR engine...";

  try {
    await loadScript("https://aframe.io/releases/1.4.2/aframe.min.js");
    await loadScript("https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js");
  } catch(e){
    statusEl.innerText = "❌ Failed loading AR libs";
    btn.disabled = false;
    return;
  }

  startAR();
};

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src;
    s.onload=res;
    s.onerror=rej;
    document.head.appendChild(s);
  });
}

function startAR(){

  document.getElementById("ar-wrap").style.display="block";
  btn.style.display="none";

  document.getElementById("ar-wrap").innerHTML = `
    <a-scene
      id="scene"
      mindar-image="imageTargetSrc: targets/card.mind;; autoStart:false;"
      vr-mode-ui="enabled:false"
      device-orientation-permission-ui="enabled:false"
      embedded>

      <a-assets></a-assets>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-box color="red" depth="0.2" height="0.2" width="0.2"></a-box>
      </a-entity>

      <a-camera position="0 0 0"></a-camera>
    </a-scene>
  `;

  const scene = document.querySelector("#scene");

  const startTimeout = setTimeout(()=>{
    statusEl.innerText = "⚠️ Taking too long... check .mind file";
  },8000);

  scene.addEventListener("loaded", async () => {

    const sys = scene.systems["mindar-image-system"];

    if(!sys){
      statusEl.innerText = "❌ MindAR system missing";
      return;
    }

    try {
      await sys.start();
      clearTimeout(startTimeout);
      statusEl.innerText = "✅ Camera started";
      console.log("AR started successfully");

    } catch(err){
      clearTimeout(startTimeout);
      console.error(err);
      statusEl.innerText = "❌ AR failed: " + err.message;
    }

  });

}
</script>

</body>
</html>
